'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#6b6b72" text-anchor="middle" font-weight="400">ampolla</text><line x1="504.0" y1="180.0" x2="536.0" y2="180.0" stroke="#7a6a3a" stroke-width="3" stroke-linecap="round"/><path d="M506,225 A 80 80 0 0 1 440,260" fill="none" stroke="#c62f3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="454.0" y1="259.0" x2="438.0" y2="260.0" stroke="#c62f3a" stroke-width="3" stroke-linecap="round"/><polygon points="438.0,260.0 444.3,256.9 444.6,262.3" fill="#c62f3a"/><text x="440.0" y="184.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.0" fill="#c62f3a" text-anchor="middle" font-weight="700">excita</text><text x="440.0" y="290.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">flujo que se aleja (ampulífugo)</text><text x="800.0" y="64.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.6" fill="#24101a" text-anchor="middle" font-weight="700">C. Excitación &gt; inhibición</text><line x1="650.0" y1="290.0" x2="950.0" y2="290.0" stroke="#24101a" stroke-width="1" stroke-linecap="round"/><line x1="800.0" y1="290.0" x2="800.0" y2="80.0" stroke="#24101a" stroke-width="1" stroke-linecap="round"/><text x="670.0" y="308.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#2b6cb0" text-anchor="start" font-weight="400">← inhibe</text><text x="930.0" y="308.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#c62f3a" text-anchor="end" font-weight="400">excita →</text><text x="800.0" y="326.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#6b6b72" text-anchor="middle" font-weight="400">velocidad de la cabeza</text><text x="806.0" y="90.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#6b6b72" text-anchor="start" font-weight="400">disparos/s</text><path d="M650,290 L720,290 L800.0,210 L950,90" fill="none" stroke="#6b3fa0" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" /><text x="792.0" y="204.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#6b6b72" text-anchor="end" font-weight="400">reposo</text><text x="660.0" y="278.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#2b6cb0" text-anchor="start" font-weight="400">tope en 0</text><text x="500.0" y="346.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="400">1. Los ojos se mueven en el plano del canal estimulado.</text><text x="500.0" y="366.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="400">2. Lateral: excita el flujo hacia la ampolla; verticales: el que se aleja.</text><text x="500.0" y="386.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="400">3. La excitación puede crecer mucho; la inhibición, solo hasta cero.</text><text x="500.0" y="418.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#6b6b72" text-anchor="middle" font-weight="400">Esquema didáctico; las leyes, según Baloh y cols. (2011).</text></svg>