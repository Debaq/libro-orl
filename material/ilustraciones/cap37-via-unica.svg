<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382"><defs></defs><rect width="640" height="382" fill="#fff"/><rect x="20" y="96" width="112" height="44" rx="8" fill="#fff" stroke="#c0571c" stroke-width="2"/><text x="76.0" y="121.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Nariz</text><line x1="132.0" y1="118.0" x2="142.0" y2="118.0" stroke="#24101a" stroke-width="1.4"/><text x="76.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">mucosa hinchada</text><text x="76.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">(rinitis)</text><text x="76.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">no se ve: la pinza</text><text x="76.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">nasal la deja fuera</text><rect x="142" y="96" width="112" height="44" rx="8" fill="#fff" stroke="#c0571c" stroke-width="2"/><text x="198.0" y="111.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Faringe y</text><text x="198.0" y="125.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">laringe</text><line x1="254.0" y1="118.0" x2="264.0" y2="118.0" stroke="#24101a" stroke-width="1.4"/><text x="198.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">parálisis de cuerdas</text><text x="198.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">vocales, tumores</text><text x="198.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">meseta inspiratoria</text><text x="198.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">(si es variable)</text><rect x="264" y="96" width="112" height="44" rx="8" fill="#fff" stroke="#c0571c" stroke-width="2"/><text x="320.0" y="111.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Tráquea</text><text x="320.0" y="125.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">extratorácica</text><line x1="376.0" y1="118.0" x2="386.0" y2="118.0" stroke="#24101a" stroke-width="1.4"/><text x="320.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">estenosis tras</text><text x="320.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">intubación</text><text x="320.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">meseta inspiratoria</text><text x="320.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">(variable) o en las dos</text><text x="320.0" y="270.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">fases (fija)</text><rect x="386" y="96" width="112" height="44" rx="8" fill="#fff" stroke="#c0571c" stroke-width="2"/><text x="442.0" y="111.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Tráquea</text><text x="442.0" y="125.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">intratorácica</text><line x1="498.0" y1="118.0" x2="508.0" y2="118.0" stroke="#24101a" stroke-width="1.4"/><text x="442.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">estenosis tras</text><text x="442.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">intubación</text><text x="442.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">meseta espiratoria</text><text x="442.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">(variable) o en las dos</text><text x="442.0" y="270.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#c0571c" text-anchor="middle" font-weight="700">fases (fija)</text><rect x="508" y="96" width="112" height="44" rx="8" fill="#fff" stroke="#21796c" stroke-width="2"/><text x="564.0" y="121.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Bronquios</text><text x="564.0" y="172.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">asma</text><text x="564.0" y="186.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="middle" font-weight="400">(broncoconstricción)</text><text x="564.0" y="242.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#21796c" text-anchor="middle" font-weight="700">curva cóncava en</text><text x="564.0" y="256.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#21796c" text-anchor="middle" font-weight="700">la espiración</text><text x="20.0" y="156.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#8a8a90" text-anchor="start" font-weight="400">Se estrecha por:</text><text x="20.0" y="226.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#8a8a90" text-anchor="start" font-weight="400">Dónde se ve en la curva flujo-volumen:</text><line x1="20.0" y1="64.0" x2="498.0" y2="64.0" stroke="#c0571c" stroke-width="2"/><line x1="20.0" y1="64.0" x2="20.0" y2="72.0" stroke="#c0571c" stroke-width="2"/><line x1="498.0" y1="64.0" x2="498.0" y2="72.0" stroke="#c0571c" stroke-width="2"/><text x="259.0" y="58.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#c0571c" text-anchor="middle" font-weight="700">Vía aérea superior (de la nariz a la carina)</text><line x1="508.0" y1="64.0" x2="620.0" y2="64.0" stroke="#21796c" stroke-width="2"/><line x1="508.0" y1="64.0" x2="508.0" y2="72.0" stroke="#21796c" stroke-width="2"/><line x1="620.0" y1="64.0" x2="620.0" y2="72.0" stroke="#21796c" stroke-width="2"/><text x="564.0" y="58.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#21796c" text-anchor="middle" font-weight="700">Vía aérea inferior</text><text x="10.0" y="22.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.6" fill="#24101a" text-anchor="start" font-weight="700">Una sola vía por donde pasa el aire</text><text x="10.0" y="40.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#8a8a90" text-anchor="start" font-weight="400">De izquierda a derecha, el camino del aire que se inspira.</text><line x1="381.0" y1="88.0" x2="381.0" y2="148.0" stroke="#8a8a90" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="381.0" y1="148.0" x2="381.0" y2="166.0" stroke="#8a8a90" stroke-width="1.2" stroke-dasharray="4 3"/><text x="381.0" y="84.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#8a8a90" text-anchor="middle" font-weight="400">entrada del tórax</text><rect x="148" y="322" width="472" height="22" rx="5" fill="#e7e5e0" stroke="#8a8a90" stroke-width="1.2"/><text x="384.0" y="337.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#24101a" text-anchor="middle" font-weight="700">Lo que mide la espirometría: el aire que pasa por la boca</text><rect x="20" y="322" width="122" height="22" rx="5" fill="#fff" stroke="#8a8a90" stroke-width="1.2" stroke-dasharray="4 3"/><text x="81.0" y="337.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.4" fill="#8a8a90" text-anchor="middle" font-weight="700">fuera</text><text x="10.0" y="368.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#24101a" text-anchor="start" font-weight="400">Con la pinza nasal puesta, el aire de la maniobra no pasa por la nariz: la espirometría no mide la nariz.</text><text x="10.0" y="384.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" fill="#8a8a90" text-anchor="start" font-weight="400">La nariz se estudia con otros exámenes (→ H25, H26, H27).</text></svg>