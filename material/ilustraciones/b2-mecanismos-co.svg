<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450"><rect width="920" height="450" fill="#fff"/><text x="460.0" y="26.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.3" fill="#24101a" text-anchor="middle" font-weight="700">Cómo llega a la cóclea la vibración del cráneo</text><rect x="30.0" y="190.0" width="180.0" height="60.0" rx="5" fill="#e8dfc8" stroke="#d8cba8" stroke-width="1"/><text x="120.0" y="217.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#24101a" text-anchor="middle" font-weight="400">vibrador en la mastoides:</text><text x="120.0" y="231.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#24101a" text-anchor="middle" font-weight="400">vibra el cráneo</text><rect x="720.0" y="175.0" width="170.0" height="90.0" rx="5" fill="#cfe3f2" stroke="#8fb8d8" stroke-width="1"/><text x="805.0" y="210.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="600">cóclea:</text><text x="805.0" y="224.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="600">se mueve la</text><text x="805.0" y="238.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.4" fill="#24101a" text-anchor="middle" font-weight="600">membrana basilar</text><rect x="330.0" y="47.0" width="270.0" height="46.0" rx="5" fill="#fff" stroke="#c0571c" stroke-width="1"/><text x="465.0" y="67.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#c0571c" text-anchor="middle" font-weight="400">1. Radiación al conducto</text><text x="465.0" y="81.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#c0571c" text-anchor="middle" font-weight="400">el conducto suena; pesa en graves</text><line x1="210.0" y1="220.0" x2="328.0" y2="70.0" stroke="#6b6b72" stroke-width="1.2" stroke-linecap="round"/><polygon points="328.0,70.0 326.2,76.8 321.9,73.4" fill="#6b6b72"/><line x1="600.0" y1="70.0" x2="718.0" y2="220.0" stroke="#c0571c" stroke-width="1.6" stroke-linecap="round"/><polygon points="718.0,220.0 711.9,216.6 716.2,213.2" fill="#c0571c"/><rect x="330.0" y="117.0" width="270.0" height="46.0" rx="5" fill="#fff" stroke="#c0571c" stroke-width="1"/><text x="465.0" y="137.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#c0571c" text-anchor="middle" font-weight="400">2. Inercia de la cadena</text><text x="465.0" y="151.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#c0571c" text-anchor="middle" font-weight="400">el estribo queda atrás; pesa en medios</text><line x1="210.0" y1="220.0" x2="328.0" y2="140.0" stroke="#6b6b72" stroke-width="1.2" stroke-linecap="round"/><polygon points="328.0,140.0 324.2,145.9 321.1,141.4" fill="#6b6b72"/><line x1="600.0" y1="140.0" x2="718.0" y2="220.0" stroke="#c0571c" stroke-width="1.6" stroke-linecap="round"/><polygon points="718.0,220.0 711.1,218.6 714.2,214.1" fill="#c0571c"/><rect x="330.0" y="187.0" width="270.0" height="46.0" rx="5" fill="#fff" stroke="#2b6cb0" stroke-width="1"/><text x="465.0" y="207.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">3. Inercia de los líquidos</text><text x="465.0" y="221.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">la más importante</text><line x1="210.0" y1="220.0" x2="328.0" y2="210.0" stroke="#6b6b72" stroke-width="1.2" stroke-linecap="round"/><polygon points="328.0,210.0 321.8,213.3 321.3,207.8" fill="#6b6b72"/><line x1="600.0" y1="210.0" x2="718.0" y2="220.0" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round"/><polygon points="718.0,220.0 711.3,222.2 711.8,216.7" fill="#2b6cb0"/><rect x="330.0" y="257.0" width="270.0" height="46.0" rx="5" fill="#fff" stroke="#2b6cb0" stroke-width="1"/><text x="465.0" y="277.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">4. Compresión de la cápsula</text><text x="465.0" y="291.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">pesa en agudos</text><line x1="210.0" y1="220.0" x2="328.0" y2="280.0" stroke="#6b6b72" stroke-width="1.2" stroke-linecap="round"/><polygon points="328.0,280.0 321.0,279.5 323.5,274.6" fill="#6b6b72"/><line x1="600.0" y1="280.0" x2="718.0" y2="220.0" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round"/><polygon points="718.0,220.0 713.5,225.4 711.0,220.5" fill="#2b6cb0"/><rect x="330.0" y="327.0" width="270.0" height="46.0" rx="5" fill="#fff" stroke="#2b6cb0" stroke-width="1"/><text x="465.0" y="347.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">5. Presión del LCR</text><text x="465.0" y="361.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#2b6cb0" text-anchor="middle" font-weight="400">por el acueducto</text><line x1="210.0" y1="220.0" x2="328.0" y2="350.0" stroke="#6b6b72" stroke-width="1.2" stroke-linecap="round"/><polygon points="328.0,350.0 321.6,347.1 325.7,343.4" fill="#6b6b72"/><line x1="600.0" y1="350.0" x2="718.0" y2="220.0" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round"/><polygon points="718.0,220.0 715.7,226.6 711.6,222.9" fill="#2b6cb0"/><line x1="30.0" y1="410.0" x2="60.0" y2="410.0" stroke="#c0571c" stroke-width="2.5" stroke-linecap="round"/><text x="66.0" y="414.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.8" fill="#c0571c" text-anchor="start" font-weight="400">dependen del oído externo y medio: cambian con el conducto tapado o la platina fija</text><text x="460.0" y="440.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.2" fill="#6b6b72" text-anchor="middle" font-weight="400">A partir de Stenfelt y Goode (2005); 1, 2 y 4 son los tres mecanismos clásicos (Tonndorf, 1966).</text></svg>