" font-weight="400">50</text><line x1="96.0" y1="154.0" x2="436.0" y2="154.0" stroke="#e7e5e0" stroke-width="1"/><text x="88.0" y="157.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">60</text><line x1="96.0" y1="120.0" x2="436.0" y2="120.0" stroke="#e7e5e0" stroke-width="1"/><text x="88.0" y="123.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">70</text><line x1="96.0" y1="86.0" x2="436.0" y2="86.0" stroke="#e7e5e0" stroke-width="1"/><text x="88.0" y="89.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">80</text><line x1="96.0" y1="52.0" x2="436.0" y2="52.0" stroke="#e7e5e0" stroke-width="1"/><text x="88.0" y="55.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.6" fill="#8a8a90" text-anchor="end" font-weight="400">90</text><line x1="96.0" y1="290.0" x2="436.0" y2="290.0" stroke="#8a8a90" stroke-width="1"/><line x1="96.0" y1="290.0" x2="96.0" y2="52.0" stroke="#8a8a90" stroke-width="1"/><text x="266.0" y="326.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#55555b" text-anchor="middle" font-weight="600">ruido en el oído no evaluado (dB EM)</text><text transform="translate(40 171.0) rotate(-90)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#55555b" text-anchor="middle" font-weight="600">umbral del oído evaluado (dB HL)</text><rect x="266.0" y="146.0" width="119.0" height="16.0" rx="4" fill="#e3efe9" stroke="none" stroke-width="0"/><path d="M78.0,239.0 L93.0,239.0" fill="none" stroke="#c62f3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#p-od)"/><text x="155.5" y="265.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#c62f3a" text-anchor="start" font-weight="700">flecha roja: umbral sin ruido (35 dB HL)</text><polyline points="96.0,239.0 181.0,239.0 266.0,154.0 385.0,154.0 436.0,103.0" fill="none" stroke="#24101a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="130.0" cy="239.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="164.0" cy="239.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="198.0" cy="222.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="232.0" cy="188.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="266.0" cy="154.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="300.0" cy="154.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="334.0" cy="154.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="368.0" cy="154.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="402.0" cy="137.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="436.0" cy="103.0" r="4.2" fill="#fff" stroke="#24101a" stroke-width="1.6"/><circle cx="138.5" cy="261.0" r="9" fill="#24101a"/><text x="138.5" y="265.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">a</text><circle cx="479.0" cy="55.8" r="9" fill="#24101a"/><text x="479.0" y="59.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">a</text><text x="494.0" y="58.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#24101a" text-anchor="start" font-weight="700">el ruido se oye, pero aún no enmascara</text><circle cx="205.5" cy="182.5" r="9" fill="#24101a"/><text x="205.5" y="186.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">b</text><circle cx="479.0" cy="95.8" r="9" fill="#24101a"/><text x="479.0" y="99.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">b</text><text x="494.0" y="98.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#24101a" text-anchor="start" font-weight="700">subenmascaramiento: el umbral sube 1 dB por dB</text><text x="494.0" y="112.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">de ruido; todavía contesta el oído no evaluado</text><circle cx="325.5" cy="130.0" r="9" fill="#21796c"/><text x="325.5" y="134.0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">c</text><circle cx="479.0" cy="135.8" r="9" fill="#21796c"/><text x="479.0" y="139.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">c</text><text x="494.0" y="138.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#21796c" text-anchor="start" font-weight="700">plateau: el umbral ya no se mueve; es el verdadero</text><text x="494.0" y="152.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">(aquí, 60 dB HL)</text><circle cx="392.5" cy="114.5" r="9" fill="#c62f3a"/><text x="392.5" y="118.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">d</text><circle cx="479.0" cy="175.8" r="9" fill="#c62f3a"/><text x="479.0" y="179.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">d</text><text x="494.0" y="178.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#c62f3a" text-anchor="start" font-weight="700">sobreenmascaramiento: el ruido cruza al oído</text><text x="494.0" y="192.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">evaluado y lo tapa; el umbral vuelve a subir 1:1</text><line x1="470.0" y1="210.8" x2="760.0" y2="210.8" stroke="#e7e5e0" stroke-width="1"/><text x="470.0" y="224.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">Cada punto es una medición: se sube el ruido de a 10 dB</text><text x="470.0" y="238.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">y se busca de nuevo el umbral. El plateau vale con al menos</text><text x="470.0" y="252.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">cuatro mediciones y tres seguidas con el mismo umbral</text><text x="470.0" y="266.8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.4" fill="#55555b" text-anchor="start" font-weight="400">(BSA, 2018).</text></svg>